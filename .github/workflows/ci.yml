name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with: { rust-components: "rustfmt, clippy" }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  p2-tests:
    name: p2 tests against GNU patch
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with: { apt-packages: "build-essential ed" }

      - name: Build GNU patch 2.8
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output patch-2.8.tar.xz https://ftp.gnu.org/gnu/patch/patch-2.8.tar.xz
          tar -xf patch-2.8.tar.xz
          cd patch-2.8
          ./configure --quiet
          make -s -j"$(nproc)"

      - name: Run p2 tests
        run: |
          P2_REFERENCE_PATCH="$RUNNER_TEMP/patch-2.8/src/patch" \
            cargo test --locked --manifest-path p2/Cargo.toml

  q-tests-against-upstream-quilt:
    name: q tests against upstream quilt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with: { apt-packages: "diffstat graphviz quilt" }

      - name: Run q compatibility tests with upstream quilt
        run: tools/run-compat-tests.sh /usr/bin/quilt

  upstream-tests-against-q:
    name: upstream quilt tests against q
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CI
        uses: ./.github/actions/setup-ci
        with: { apt-packages: "diffstat graphviz perl" }

      - name: Clone upstream quilt tests
        uses: ./.github/actions/clone-upstream-quilt
        with: { path: "~/quilt" }

      - name: Run upstream quilt tests with q
        run: |
          export QUILT_SRC="$HOME/quilt"
          export VERBOSE_FAILURES=1
          tools/run-upstream-tests.sh
